site_name: Knowledge
site_description: 个人知识库 — 笔记、文档与随手记
site_author: ImJingLan
site_url: https://xihuu.github.io/Knowledge/

# 构建产物目录。CI 里的 "部署到 Deploy 分支" 和 "发布到服务器" 都按 public 走，
# 改这里就必须同步改 .github/workflows/ci.yml 里的 folder / SOURCE。
site_dir: public

repo_name: XiHuu/Knowledge
repo_url: https://github.com/XiHuu/Knowledge
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 ImJingLan

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    # 导航
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    # 搜索
    - search.suggest
    - search.highlight
    - search.share
    # 内容
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - API 与账号:
      - DeepSeek 余额与用量查询: api/deepseek-account-balance.md
  - 网络与穿透:
      - frp vhost 与 SNI 透传: frp/vhost-sni-tls.md
  - 工程实践:
      - MkDocs × GitHub Actions: devops/mkdocs-github-actions.md
      - 受限网络下部署 Hermes: devops/hermes-remote-deploy.md
  - 银行卡与开户:
      - 中国大陆:
          - 学生信用卡总览（0 门槛）: banking/mainland/student-cards-overview.md
          - 工行 宇宙星座信用卡校园版: banking/mainland/icbc-constellation-campus.md
          - 建行 龙卡 bilibili（学生版）: banking/mainland/ccb-bilibili-campus.md
          - 中行 长城无界青春卡校园版: banking/mainland/boc-greatwall-campus.md
          - 中信银行 校园 i 卡: banking/mainland/citic-campus-i.md
          - 招商银行 Young 卡 / 校园版: banking/mainland/cmb-young-campus.md
          - 交通银行 校园卡（已停发）: banking/mainland/bocom-campus-card.md
          - 其他银行学生卡与停发清单: banking/mainland/other-student-cards.md
      - 香港:
          - 香港银行开户总览: banking/hk/hk-banks-overview.md
          - 中银香港（BOCHK）: banking/hk/bochk-hk-account.md
          - 汇丰香港（HSBC）: banking/hk/hsbc-hk-account.md
          - 工银亚洲（ICBC Asia）: banking/hk/icbc-asia-account.md
          - 恒生银行（Hang Seng）: banking/hk/hang-seng-hk-account.md
      - 海外:
          - 海外银行卡与信用卡（待补充）: banking/overseas/index.md
  - 税务与公司:
      - 美国 ITIN: tax/itin-us.md
      - 英国公司成本: tax/uk-company-cost.md
      - 马来西亚 TIN: tax/malaysia-tin.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  # 必需：解析 :material-xxx: / :octicons-xxx: / :fontawesome-xxx: 短代码为内联 SVG。
  # 缺了它，首页卡片标题和 extra.social 的图标都会原样显示成文字。
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/XiHuu
      name: XiHuu on GitHub

extra_css:
  - assets/extra.css
