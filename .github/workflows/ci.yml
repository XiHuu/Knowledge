name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

# JamesIves/github-pages-deploy-action 需要写权限（要推 deploy 分支）
permissions:
  contents: write

# 同一分支有旧任务在跑时直接取消旧的，避免两个 rsync 同时写服务器上同一个目录
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 首页「最近更新」由 git 历史生成，浅克隆拿不到完整 log
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          key: pip-${{ hashFiles('requirements.txt') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-

      - name: Cache mkdocs-material
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Restore mkdocs-material cache
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 生成首页「最近更新」
        run: python scripts/gen_updates.py

      - name: Build site
        run: mkdocs build --strict

      # ---------- 渲染完成后：先把 public 推到 deploy 分支 ----------
      - name: 部署到 Deploy 分支
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy
          folder: public

      # ---------- 再把 public rsync 到服务器 ----------
      - name: 发布到服务器
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          EXCLUDE: "/.git/, /.github/, /README.md, /LICENSE, /html_files.txt"
          SOURCE: "public"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          TARGET: ${{ secrets.SITE_ADDR }}
